<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="ה־API במבט אחד">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6DE"/><stop offset=".55" stop-color="#E8E4FF"/><stop offset="1" stop-color="#D9F3E7"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/></linearGradient>
<linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B3A9FA"/><stop offset="1" stop-color="#6F60F0"/></linearGradient>
<linearGradient id="sc" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#A9E3CD" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<path id="s" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/>
<path id="sh" d="M0-30 24-21V-3C24 13 13 24 0 30-13 24-24 13-24-3V-21Z"/><clipPath id="c"><rect width="1200" height="150" rx="28"/></clipPath></defs><style>
.blob{animation:drift 11s ease-in-out infinite alternate}.b2{animation-duration:14s;animation-direction:alternate-reverse}.b3{animation-duration:17s}
.bob{animation:bob 3.4s ease-in-out infinite}.d1{animation-delay:-.9s}.d2{animation-delay:-1.8s}.d3{animation-delay:-2.6s}
.tw{animation:tw 3.2s ease-in-out infinite}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.scan{animation:scan 3.6s ease-in-out infinite}
.dot{animation:dot 3.6s ease-in-out infinite;opacity:0}
.blink{animation:blink 1s steps(1) infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
@keyframes drift{to{transform:translate(40px,-20px) scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(330px)}100%{transform:translateX(0)}}
@keyframes dot{0%,8%{opacity:0}14%,80%{opacity:1}92%,100%{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dot{opacity:1}}
</style>
<g clip-path="url(#c)"><rect width="1200" height="150" fill="url(#bg)"/><circle class="blob" cx="110" cy="140" r="95" fill="#CFC8FF" opacity=".5"/><circle class="blob b2" cx="1090" cy="20" r="105" fill="#A9E3CD" opacity=".42"/>
<use class="tw" href="#s" x="290" y="50" fill="#FFB4A2"/><use class="tw t2" href="#s" x="190" y="104" fill="#B3A9FA"/><use class="tw t3" href="#s" x="910" y="50" fill="#F5B8C8"/><use class="tw" href="#s" x="1010" y="104" fill="#A9E3CD"/>
<g transform="translate(90 75.0)"><g class="bob d1"><use href="#sh" fill="url(#sg)"/><circle cy="-4" r="5" fill="#fff"/><path d="M-3-2h6l1.5 10h-9Z" fill="#fff"/></g></g>
<g transform="translate(1110 75.0)"><g class="bob d3"><use href="#sh" fill="#FFB4A2"/><path d="M-9 0l6 6 12-12" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" direction="rtl"><text x="600" y="72" font-size="46" font-weight="800" fill="url(#t)">ה־API במבט אחד</text><text x="600" y="112" font-size="23" fill="#7A6B88">כל הנקודות, עם דוגמה אמיתית</text></g>
<g transform="translate(600 136)"><g class="bob"><path d="M-10-5l10 9 10-9" fill="none" stroke="#6F60F0" stroke-opacity=".55" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg>