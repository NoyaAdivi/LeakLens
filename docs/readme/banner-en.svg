<text x="16" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#7A6B88" >only 5 characters of the hash ever leave the server</text></g><g transform="translate(650 270)"><rect class="pulse" x="0" y="0" width="70" height="14" rx="7" fill="#F5B8C8" style="animation-delay:0.0s"/><rect class="pulse" x="80" y="0" width="70" height="14" rx="7" fill="#FFB4A2" style="animation-delay:0.25s"/><rect class="pulse" x="160" y="0" width="70" height="14" rx="7" fill="#FFE08A" style="animation-delay:0.5s"/><rect class="pulse" x="240" y="0" width="70" height="14" rx="7" fill="#A9E3CD" style="animation-delay:0.75s"/><rect class="pulse" x="320" y="0" width="70" height="14" rx="7" fill="#7FD3B0" style="animation-delay:1.0s"/></g>
