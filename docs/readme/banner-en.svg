<linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B3A9FA"/><stop offset="1" stop-color="#6F60F0"/></linearGradient>
<linearGradient id="sc" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#A9E3CD" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<path id="s" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/>
<path id="sh" d="M0-30 24-21V-3C24 13 13 24 0 30-13 24-24 13-24-3V-21Z"/><clipPath id="c"><rect width="1200" height="340" rx="32"/></clipPath><clipPath id="fc"><rect width="390" height="68" rx="20"/></clipPath></defs><style>
.blob{animation:drift 11s ease-in-out infinite alternate}.b2{animation-duration:14s;animation-direction:alternate-reverse}.b3{animation-duration:17s}
.bob{animation:bob 3.4s ease-in-out infinite}.d1{animation-delay:-.9s}.d2{animation-delay:-1.8s}.d3{animation-delay:-2.6s}
.tw{animation:tw 3.2s ease-in-out infinite}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.scan{animation:scan 3.6s ease-in-out infinite}
.dot{animation:dot 3.6s ease-in-out infinite;opacity:0}
.blink{animation:blink 1s steps(1) infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
@keyframes drift{to{transform:translate(40px,-20px) scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(330px)}100%{transform:translateX(0)}}
@keyframes dot{0%,8%{opacity:0}14%,80%{opacity:1}92%,100%{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dot{opacity:1}}
</style>
